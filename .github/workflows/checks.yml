name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            console: pwsh
          - os: windows-latest
            console: pwsh
          - os: windows-latest
            console: powershell.exe   # Windows PowerShell 5.1
    name: tests (${{ matrix.os }}, pasted into ${{ matrix.console }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - name: Lint and test
        shell: pwsh
        env:
          TRIAGE_TEST_SHELL: ${{ matrix.console }}
        run: ./tools/Invoke-Checks.ps1
